[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-acoustics"
version = "0.1.0"
description = "EK80 淡水鱼类资源评估系统"
requires-python = ">=3.10"
dependencies = [
    "echopype>=0.11.0",
    "xarray",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "PySide6>=6.6.0",
    "PyOpenGL>=3.1.7",
    "scipy",
    "h5py",
    "h5netcdf",
    "openpyxl",
]

[tool.setuptools.package-data]
"src.gui" = ["assets/icons/*.svg", "assets/presets.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: requires local EK80 raw data and --run-real-data",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F",    # pyflakes: F821 未定义名, F401 未使用导入, F841 未使用变量, F811 重复定义
    "E4",   # import 相关
    "E7",   # statement 相关
    "E9",   # runtime error 相关
    "W",    # pycodestyle warnings
]

