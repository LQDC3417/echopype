reservoir:
  name: "示例水库"
  region: "福建"

input:
  raw_dir: "./raw_data"          # 修改为你的 raw 文件目录
  pattern: "*.raw"

processing:
  sonar_model: "EK80"
  frequencies: [38000, 70000, 120000]
  waveform_mode: "CW"
  encode_mode: "power"
  noise_removal:
    ping_num: 5
    range_sample_num: 10
    SNR_threshold: "3.0dB"
  bottom_detection:
    method: "basic"
    threshold: -40.0
    offset_m: 0.5
    bin_skip_from_surface: 50

school_detection:
  method: "echoview"
  thr: -55.0
  mincan: [3.0, 10.0]
  maxlink: [3.0, 15.0]
  minsho: [3.0, 15.0]

density:
  ts_default: -30.0
  avg_weight_kg: 0.5            # 平均单体鱼重量(kg)，用于生物量估算

output:
  dir: "./outputs"               # 修改为你的输出目录
  formats: ["csv", "png"]
