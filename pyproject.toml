[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fish-acoustics"
version = "0.1.0"
description = "EK80 淡水鱼类资源评估系统"
requires-python = ">=3.10"
dependencies = [
    "echopype>=0.11.0",
    "xarray",
    "pandas",
    "numpy",
    "matplotlib",
    "click",
    "pyyaml",
    "echopype>=0.11.0",
    "PySide6>=6.6.0",
    "PyOpenGL>=3.1.7",
    "scipy",
]

[project.scripts]
fish-acoustics = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F",    # pyflakes: F821 未定义名, F401 未使用导入, F841 未使用变量, F811 重复定义
    "E4",   # import 相关
    "E7",   # statement 相关
    "E9",   # runtime error 相关
    "W",    # pycodestyle warnings
]

